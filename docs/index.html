<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AI Daily Intelligence</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b0f17; --card:#131a26; --card2:#182131; --border:#22304a;
    --text:#e8eef7; --muted:#8fa0b5; --accent:#4da3ff; --accent2:#7aa7ff;
    --chip:#1d2940; --danger:#ff6b6b; --ok:#4dd882;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    padding:14px 14px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  h1{font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
  .refresh{background:var(--chip);border:1px solid var(--border);color:var(--muted);border-radius:10px;
    padding:7px 11px;font-size:13px;cursor:pointer;flex-shrink:0}
  .refresh:active{transform:scale(.95)}
  .navbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .navbtn{background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:10px;
    width:36px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0}
  .navbtn:disabled{opacity:.35}
  select{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:10px;height:34px;padding:0 8px;font-size:14px;appearance:none;text-align:center}
  .search{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:10px;height:36px;padding:0 12px;font-size:14px;margin-bottom:14px;outline:none}
  .search:focus{border-color:var(--accent)}
  .search::placeholder{color:var(--muted)}
  .highlights{background:linear-gradient(145deg,#16203a,#121a2c);border:1px solid #2a3b5e;
    border-radius:14px;padding:14px;margin-bottom:16px}
  .highlights h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent2);margin-bottom:10px}
  .highlights ol{padding-left:20px;display:grid;gap:7px}
  .highlights li{font-size:14px;line-height:1.45}
  .section{margin-bottom:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card)}
  .section>button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
    color:var(--text);padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
  .section .cnt{margin-left:auto;background:var(--chip);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted)}
  .section .arrow{color:var(--muted);transition:transform .2s;font-size:12px}
  .section.open .arrow{transform:rotate(90deg)}
  .items{display:none;padding:2px 12px 12px}
  .section.open .items{display:grid;gap:10px}
  .item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
  .item a{color:var(--text);font-size:14.5px;font-weight:600;text-decoration:none;line-height:1.4;display:block}
  .item a:active{color:var(--accent)}
  .item .sum{color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:5px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .chip{background:var(--chip);border-radius:7px;padding:2.5px 8px;font-size:11.5px;color:var(--muted)}
  .chip.org{color:var(--accent2);font-weight:600}
  .state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:1.7}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .retry{background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:10px;
    padding:8px 18px;font-size:14px;cursor:pointer;margin-top:12px}
  footer{text-align:center;color:#5b6b82;font-size:11.5px;margin-top:22px;line-height:1.6}
  footer a{color:#7488a5}
</style>
</head>
<body>
  <header>
    <h1><span class="dot"></span> AI Daily Intel</h1>
    <button class="refresh" id="refresh">⟳ Refresh</button>
  </header>

  <div class="navbar">
    <button class="navbtn" id="prev" title="Newer">‹</button>
    <select id="dateSel"></select>
    <button class="navbtn" id="next" title="Older">›</button>
  </div>

  <input class="search" id="search" placeholder="🔍 Filter headlines…" />

  <div id="content"><div class="state"><div class="spinner"></div>Loading report…</div></div>

  <footer id="footer"></footer>

<script>
(function(){
  var ORG_META = [
    ['openai','OpenAI','⚪'], ['anthropic','Anthropic','🟠'], ['claude','Anthropic','🟠'],
    ['google','Google DeepMind','🔵'], ['gemini','Google DeepMind','🔵'], ['deepmind','Google DeepMind','🔵'],
    ['meta','Meta AI','🟣'], ['llama','Meta AI','🟣'], ['xai','xAI','⚫'], ['grok','xAI','⚫'],
    ['microsoft','Microsoft','🟩'], ['copilot','Microsoft','🟩'], ['nvidia','NVIDIA','💚'],
    ['mistral','Mistral','🟡'], ['open source','Open Source','🆓'], ['oss','Open Source','🆓'],
    ['policy','Policy & Regulation','⚖️'], ['regulat','Policy & Regulation','⚖️'], ['eu','Policy & Regulation','⚖️'],
    ['research','Research','🔬'], ['industry','Industry','🏢'], ['apple','Apple','🍎'],
    ['amazon','Amazon','📦'], ['deepseek','DeepSeek','🐳'], ['qwen','Alibaba Qwen','🐳'],
    ['nous','Nous Research','🐎']
  ];
  function orgMeta(name){
    var n=(name||'').toLowerCase();
    for(var i=0;i<ORG_META.length;i++){ if(n.indexOf(ORG_META[i][0])!==-1) return ORG_META[i].slice(1); }
    return ['AI Industry','✨'];
  }

  var state={dates:[], idx:0, report:null, query:''};
  var content=document.getElementById('content'), dateSel=document.getElementById('dateSel');

  if(window.Telegram && Telegram.WebApp){
    try{
      Telegram.WebApp.ready(); Telegram.WebApp.expand();
      Telegram.WebApp.setHeaderColor('#0b0f17'); Telegram.WebApp.setBackgroundColor('#0b0f17');
    }catch(e){}
  }

  function bust(){ return '?v=' + Date.now(); }

  function fetchJSON(url){
    return fetch(url + bust(), {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    });
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    var r=state.report;
    if(!r){ content.innerHTML='<div class="state"><div class="spinner"></div>Loading report…</div>'; return; }
    var q=state.query.trim().toLowerCase();
    var html='';

    if(r.highlights && r.highlights.length && !q){
      html+='<div class="highlights"><h2>⚡ Today\u2019s Highlights</h2><ol>';
      r.highlights.forEach(function(h){ html+='<li>'+esc(h)+'</li>'; });
      html+='</ol></div>';
    }

    var shown=0;
    (r.sections||[]).forEach(function(sec){
      var items=(sec.items||[]).filter(function(it){
        if(!q) return true;
        var hay=(sec.org+' '+it.title+' '+(it.summary||'')+' '+(it.source||'')).toLowerCase();
        return hay.indexOf(q)!==-1;
      });
      if(!items.length) return;
      shown+=items.length;
      var om=orgMeta(sec.org);
      html+='<div class="section open">'
        +'<button onclick="this.parentNode.classList.toggle(\'open\')">'
        +'<span>'+om[1]+'</span><span>'+esc(sec.org)+'</span>'
        +'<span class="cnt">'+items.length+'</span><span class="arrow">▶</span></button>'
        +'<div class="items">';
      items.forEach(function(it){
        html+='<div class="item">'
          +'<a href="'+esc(it.url||'#')+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'
          +(it.summary?'<div class="sum">'+esc(it.summary)+'</div>':'')
          +'<div class="meta">'
          +(it.source?'<span class="chip">'+esc(it.source)+'</span>':'')
          +(it.date?'<span class="chip">'+esc(it.date)+'</span>':'')
          +'</div></div>';
      });
      html+='</div></div>';
    });

    if(!shown){
      html='<div class="state">No items match "'+esc(state.query)+'"</div>';
    }
    content.innerHTML=html;

    var gen=r.generated_at? new Date(r.generated_at) : null;
    document.getElementById('footer').innerHTML =
      'Report for <b>'+esc(r.date)+'</b>'+(gen?' · generated '+esc(gen.toISOString().slice(0,16).replace('T',' '))+' UTC':'')+
      '<br>Curated daily by <a href="https://github.com/nousresearch/hermes-agent" target="_blank" rel="noopener">Hermes Agent</a>';
  }

  function loadReport(date){
    content.innerHTML='<div class="state"><div class="spinner"></div>Loading '+esc(date)+'…</div>';
    fetchJSON('reports/'+date+'.json').then(function(r){
      state.report=r; state.idx=state.dates.indexOf(date);
      render();
      document.getElementById('prev').disabled = state.idx<=0;
      document.getElementById('next').disabled = state.idx>=state.dates.length-1;
    }).catch(function(e){
      content.innerHTML='<div class="state">⚠️ Could not load report for '+esc(date)+'.<br>'+
        '<button class="retry" onclick="load()">Retry</button></div>';
    });
  }

  window.load=function(){
    content.innerHTML='<div class="state"><div class="spinner"></div>Loading…</div>';
    fetchJSON('reports/index.json').then(function(idx){
      state.dates=(idx.reports||[]).slice().sort().reverse();
      if(!state.dates.length){
        content.innerHTML='<div class="state">No reports yet — the first one lands soon. 🌱</div>';
        return;
      }
      dateSel.innerHTML=state.dates.map(function(d){
        return '<option value="'+d+'">'+d+'</option>';
      }).join('');
      var urlD=new URLSearchParams(location.search).get('date');
      var pick=state.dates.indexOf(urlD||'')!==-1? urlD : state.dates[0];
      dateSel.value=pick;
      loadReport(pick);
    }).catch(function(e){
      content.innerHTML='<div class="state">⚠️ Could not reach the report service.<br>'+
        '<button class="retry" onclick="load()">Retry</button></div>';
    });
  };

  dateSel.addEventListener('change',function(){ state.query=''; document.getElementById('search').value=''; loadReport(dateSel.value); });
  document.getElementById('prev').addEventListener('click',function(){ if(state.idx>0){ dateSel.value=state.dates[state.idx-1]; dateSel.dispatchEvent(new Event('change')); } });
  document.getElementById('next').addEventListener('click',function(){ if(state.idx<state.dates.length-1){ dateSel.value=state.dates[state.idx+1]; dateSel.dispatchEvent(new Event('change')); } });
  document.getElementById('refresh').addEventListener('click',function(){ window.load(); });
  document.getElementById('search').addEventListener('input',function(e){ state.query=e.target.value; render(); });

  window.load();
})();
</script>
</body>
</html>
